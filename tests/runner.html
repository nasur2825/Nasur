<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>NASUR – Phase 1 Tests</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7f6; --card: #ffffff; --fg: #14201c; --muted: #4a5b55; --line: #d2dcd8;
      --pass: #1b7f3b; --fail: #c62828; --skip: #8a6d00; --brand: #0b6e5a; --brand-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1513; --card: #151f1c; --fg: #e6eeeb; --muted: #a9bab4; --line: #2a3a35;
        --pass: #5fd38a; --fail: #ff8a80; --skip: #f5b942; --brand: #34c3a2; --brand-fg: #04201a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; color: var(--fg); background: var(--bg); }
    main { max-width: 52rem; margin: 0 auto; }
    h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
    .lead { margin: 0 0 1rem; color: var(--muted); }
    #summary { padding: 0.75rem 1rem; margin-bottom: 1rem; font-weight: 600; background: var(--card); border: 1px solid var(--line); border-left-width: 6px; border-radius: 0.5rem; }
    #summary.ok { border-left-color: var(--pass); }
    #summary.bad { border-left-color: var(--fail); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; margin-bottom: 1rem; }
    button { min-height: 2.75rem; padding: 0.5rem 1rem; font: inherit; font-weight: 600; color: var(--brand-fg); background: var(--brand); border: 0; border-radius: 0.5rem; cursor: pointer; }
    button.secondary { color: var(--fg); background: var(--card); border: 1px solid var(--line); }
    .suite { margin-bottom: 1rem; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 0.5rem; }
    .suite h2 { display: flex; justify-content: space-between; gap: 1rem; margin: 0; padding: 0.6rem 1rem; font-size: 1rem; border-bottom: 1px solid var(--line); }
    .suite .count { font-weight: 400; color: var(--muted); white-space: nowrap; }
    .suite ul { margin: 0; padding: 0; list-style: none; }
    .suite li { display: flex; gap: 0.75rem; padding: 0.4rem 1rem; border-top: 1px solid var(--line); }
    .suite li:first-child { border-top: 0; }
    .mark { flex: none; width: 1.25rem; font-weight: 700; text-align: center; }
    li.pass .mark { color: var(--pass); }
    li.fail .mark { color: var(--fail); }
    li.skip .mark { color: var(--skip); }
    li.fail { background: rgba(198, 40, 40, 0.08); }
    pre { margin: 0.25rem 0 0; white-space: pre-wrap; word-break: break-word; font: 0.85rem ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
    li.fail pre { color: var(--fail); }
    .only-failed li.pass, .only-failed li.skip { display: none; }
    #report-fallback { display: none; width: 100%; height: 10rem; margin-top: 0.5rem; font: 0.8rem ui-monospace, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>NASUR Phase 1 tests</h1>
    <p class="lead">Checks the files, the database, the repository rules, settings, security helpers and the router. Tests use their own scratch database and never touch your saved data.</p>
    <div id="summary" role="status" aria-live="polite">Starting…</div>
    <div class="toolbar">
      <button type="button" id="btn-copy">Copy report</button>
      <button type="button" id="btn-rerun" class="secondary">Run again</button>
      <label><input type="checkbox" id="chk-failures"> Show only problems</label>
    </div>
    <div id="results"></div>
    <textarea id="report-fallback" readonly aria-label="Test report"></textarea>
  </main>

  <script type="module">
    /* ======================================================================
       1. SETTINGS, TINY TEST FRAMEWORK AND HELPERS
       ====================================================================== */

    const TEST_TIMEOUT_MS = 20000;
    const TEST_DB = 'nasur-test-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    const ROOT = new URL('../', import.meta.url);

    const LS_WATCH = ['nasur.language', 'nasur.theme', 'nasur.last_route'];
    const lsBackup = {};
    for (const key of LS_WATCH) {
      try { lsBackup[key] = localStorage.getItem(key); } catch { lsBackup[key] = null; }
    }

    const els = {
      summary: document.getElementById('summary'),
      results: document.getElementById('results'),
      copy: document.getElementById('btn-copy'),
      rerun: document.getElementById('btn-rerun'),
      onlyFailed: document.getElementById('chk-failures'),
      fallback: document.getElementById('report-fallback')
    };

    class SkipSignal extends Error {}
    function skip(reason) { throw new SkipSignal(reason); }

    const suites = [];
    function suite(name, build) {
      const entry = { name, tests: [], before: null, after: null, ui: null };
      suites.push(entry);
      build({
        test(title, fn) { entry.tests.push({ title, fn }); },
        before(fn) { entry.before = fn; },
        after(fn) { entry.after = fn; }
      });
    }

    function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    function stable(value) {
      if (Array.isArray(value)) { return value.map(stable); }
      if (value !== null && typeof value === 'object' && !(value instanceof Date)) {
        const output = {};
        for (const key of Object.keys(value).sort()) { output[key] = stable(value[key]); }
        return output;
      }
      return value;
    }
    function same(a, b) { return JSON.stringify(stable(a)) === JSON.stringify(stable(b)); }

    function show(value) {
      if (value === undefined) { return 'undefined'; }
      let text;
      try { text = JSON.stringify(value); } catch { text = String(value); }
      if (text === undefined) { text = String(value); }
      return text.length > 160 ? text.slice(0, 157) + '…' : text;
    }

    function assert(condition, message) {
      if (!condition) { throw new Error(message || 'Assertion failed.'); }
    }
    function eq(actual, expected, label) {
      if (!Object.is(actual, expected)) {
        throw new Error((label ? label + ': ' : '') + 'expected ' + show(expected) + ' but got ' + show(actual));
      }
    }
    function deepEq(actual, expected, label) {
      if (!same(actual, expected)) {
        throw new Error((label ? label + ': ' : '') + 'expected ' + show(expected) + ' but got ' + show(actual));
      }
    }

    /** Runs fn (sync or async) and checks that it fails with an error code (text) or error class. */
    async function expectError(fn, matcher, label) {
      let caught = null;
      let failed = false;
      try { await fn(); } catch (error) { caught = error; failed = true; }
      const prefix = label ? label + ': ' : '';
      if (!failed) { throw new Error(prefix + 'expected an error but none was thrown'); }
      if (typeof matcher === 'string') {
        if (!caught || caught.code !== matcher) {
          throw new Error(prefix + 'expected error code "' + matcher + '" but got "' + (caught && caught.code) + '" (' + (caught && caught.message) + ')');
        }
      } else if (typeof matcher === 'function' && !(caught instanceof matcher)) {
        throw new Error(prefix + 'expected ' + matcher.name + ' but got ' + (caught && caught.name) + ': ' + (caught && caught.message));
      }
      return caught;
    }

    function captureConsole() {
      const original = { error: console.error, warn: console.warn };
      const captured = { errors: [], warnings: [] };
      console.error = (...args) => { captured.errors.push(args); };
      console.warn = (...args) => { captured.warnings.push(args); };
      captured.restore = () => { console.error = original.error; console.warn = original.warn; };
      return captured;
    }

    function withTimeout(promise, ms) {
      let timer;
      const timeout = new Promise((resolve, reject) => {
        timer = setTimeout(() => reject(new Error('Timed out after ' + ms / 1000 + ' seconds.')), ms);
      });
      return Promise.race([Promise.resolve(promise), timeout]).finally(() => clearTimeout(timer));
    }

    function describeError(error) {
      const message = error && error.message ? error.message : String(error);
      return error && error.code ? message + ' [' + error.code + ']' : message;
    }


    /* ======================================================================
       2. LOAD THE APP MODULES (app.js is never imported: it would start the app)
       ====================================================================== */

    const MODULE_PATHS = {
      config: 'js/core/config.js',
      eventbus: 'js/core/eventbus.js',
      router: 'js/core/router.js',
      sanitize: 'js/services/sanitize.js',
      db: 'js/services/db.js',
      repo: 'js/services/repo.js',
      ucfg: 'js/services/config.js'
    };
    const loaded = {};
    const loadFailures = [];
    for (const [name, path] of Object.entries(MODULE_PATHS)) {
      try {
        loaded[name] = await import(new URL(path, ROOT).href);
      } catch (error) {
        loadFailures.push({ name, path, message: (error && error.message) || String(error) });
      }
    }
    const { config: cfg, eventbus: ev, router, sanitize: san, db, repo, ucfg } = loaded;


    /* ======================================================================
       3. PROJECT FILES AND STATIC CHECKS
       ====================================================================== */

    const PROJECT_FILES = [
      'index.html', 'manifest.webmanifest', 'sw.js', 'icons/icon.svg',
      'css/tokens.css', 'css/base.css', 'css/components.css',
      'js/core/config.js', 'js/core/eventbus.js', 'js/core/router.js', 'js/core/app.js',
      'js/services/sanitize.js', 'js/services/db.js', 'js/services/repo.js', 'js/services/config.js',
      'data/modules.json', 'data/hooks/manufacturing-hooks.json'
    ];
    const CSS_FILES = ['css/tokens.css', 'css/base.css', 'css/components.css'];
    const JS_FILES = PROJECT_FILES.filter((path) => path.endsWith('.js') && path !== 'sw.js');
    const INDUSTRY_IDS = ['construction', 'manufacturing', 'industrial_maintenance', 'facilities_management', 'warehousing_logistics', 'food_manufacturing', 'consultancy'];
    const INDEX_IDS = ['boot-screen', 'boot-stuck', 'app-header', 'app-subtitle', 'status-network', 'btn-theme', 'btn-theme-glyph', 'main-nav', 'main-nav-list', 'app-main', 'view-root', 'toast-region', 'modal-root', 'jarvis-root'];
    const UNSTYLED_OK = new Set(['view', 'modal-root', 'jarvis-root']);

    const textCache = new Map();
    async function fetchText(path) {
      if (textCache.has(path)) { return textCache.get(path); }
      const response = await fetch(new URL(path, ROOT).href, { cache: 'no-store' });
      if (!response.ok) { throw new Error(path + ' could not be loaded (HTTP ' + response.status + ').'); }
      const text = await response.text();
      textCache.set(path, text);
      return text;
    }
    async function fetchJson(path) { return JSON.parse(await fetchText(path)); }
    function parseHtml(text) { return new DOMParser().parseFromString(text, 'text/html'); }
    function stripCssComments(text) { return text.replace(/\/\*[\s\S]*?\*\//g, ''); }

    function classTokens(text) {
      const tokens = new Set();
      for (const match of text.matchAll(/class="([^"]+)"/g)) {
        for (const token of match[1].split(/\s+/)) { tokens.add(token); }
      }
      for (const match of text.matchAll(/className\s*=\s*'([^']+)'/g)) {
        for (const token of match[1].split(/\s+/)) { tokens.add(token); }
      }
      return Array.from(tokens).filter((token) => /^[a-z][a-z0-9_-]*$/.test(token));
    }

    function blockAfter(text, marker) {
      const start = text.indexOf(marker);
      if (start === -1) { throw new Error('Could not find "' + marker + '" in css/tokens.css.'); }
      const open = text.indexOf('{', start);
      const close = text.indexOf('}', open);
      return text.slice(open + 1, close);
    }
    function declarations(block) {
      const map = {};
      for (const match of block.matchAll(/(--[a-z0-9-]+)\s*:\s*([^;]+);/g)) {
        map[match[1]] = match[2].trim().replace(/\s+/g, ' ');
      }
      return map;
    }

    suite('Modules load without errors', ({ test }) => {
      for (const [name, path] of Object.entries(MODULE_PATHS)) {
        test(path + ' loads', () => {
          const failure = loadFailures.find((item) => item.name === name);
          if (failure) { throw new Error(failure.message); }
          assert(loaded[name], 'The module did not load.');
        });
      }
    });

    suite('Project files and static checks', ({ test }) => {
      test('every Phase 1 file can be loaded and is not empty', async () => {
        const problems = [];
        for (const path of PROJECT_FILES) {
          try {
            const text = await fetchText(path);
            if (text.trim() === '') { problems.push(path + ' is empty'); }
          } catch (error) { problems.push(error.message); }
        }
        assert(problems.length === 0, problems.join('\n'));
      });

      test('README.md is present (optional)', async () => {
        try { await fetchText('README.md'); } catch { skip('README.md was not served. It is only a description, so this is fine.'); }
      });

      test('JSON files are valid', async () => {
        for (const path of ['manifest.webmanifest', 'data/modules.json', 'data/hooks/manufacturing-hooks.json']) {
          try { await fetchJson(path); } catch (error) { throw new Error(path + ': ' + error.message); }
        }
      });

      test('CSS files are complete (balanced braces and comments)', async () => {
        for (const path of CSS_FILES) {
          const raw = await fetchText(path);
          eq((raw.match(/\/\*/g) || []).length, (raw.match(/\*\//g) || []).length, path + ' comment markers');
          const text = stripCssComments(raw);
          eq((text.match(/\{/g) || []).length, (text.match(/\}/g) || []).length, path + ' braces');
          assert(text.trim().endsWith('}'), path + ' does not end with a closing brace (upload may be cut off).');
        }
      });

      test('index.html is complete', async () => {
        const text = (await fetchText('index.html')).trim();
        assert(/^<!DOCTYPE html>/i.test(text), 'Missing <!DOCTYPE html>.');
        assert(text.endsWith('</html>'), 'index.html does not end with </html> (upload may be cut off).');
      });

      test('sw.js is valid JavaScript', async () => {
        const source = await fetchText('sw.js');
        try { new Function(source); } catch (error) { throw new Error('sw.js has a syntax error: ' + error.message); }
      });

      test('JavaScript files import only files that exist and names that are exported', async () => {
        const namespaces = new Map();
        for (const [name, path] of Object.entries(MODULE_PATHS)) {
          if (loaded[name]) { namespaces.set(new URL(path, ROOT).href, loaded[name]); }
        }
        const problems = [];
        for (const path of JS_FILES) {
          const text = await fetchText(path);
          const fileUrl = new URL(path, ROOT);
          for (const match of text.matchAll(/^import\s+([^;]*?)\s+from\s*['"]([^'"]+)['"]/gm)) {
            const clause = match[1];
            const specifier = match[2];
            if (!specifier.startsWith('.')) { problems.push(path + ' imports "' + specifier + '", which is not a relative path.'); continue; }
            const resolved = new URL(specifier, fileUrl).href;
            const relative = resolved.startsWith(ROOT.href) ? resolved.slice(ROOT.href.length) : null;
            if (!relative || !PROJECT_FILES.includes(relative)) { problems.push(path + ' imports a file that is not in the project: ' + specifier); continue; }
            const braces = clause.match(/\{([\s\S]*)\}/);
            const namespace = namespaces.get(resolved);
            if (braces && namespace) {
              const names = braces[1].split(',').map((part) => part.trim()).filter(Boolean).map((part) => part.split(/\s+as\s+/)[0].trim());
              for (const name of names) {
                if (!(name in namespace)) { problems.push(path + ' imports "' + name + '" but ' + relative + ' does not export it.'); }
              }
            }
          }
        }
        assert(problems.length === 0, problems.join('\n'));
      });

      test('index.html: Content-Security-Policy blocks inline code', async () => {
        const doc = parseHtml(await fetchText('index.html'));
        const meta = doc.querySelector('meta[http-equiv="Content-Security-Policy"]');
        assert(meta, 'The CSP meta tag is missing.');
        const csp = meta.getAttribute('content');
        const directives = {};
        for (const part of csp.split(';').map((item) => item.trim()).filter(Boolean)) {
          const [name, ...values] = part.split(/\s+/);
          directives[name] = values;
        }
        deepEq(directives['script-src'], ["'self'"], 'script-src');
        deepEq(directives['style-src'], ["'self'"], 'style-src');
        assert(directives['default-src'] && directives['default-src'].includes("'self'"), 'default-src must allow only self.');
        assert(directives['object-src'] && directives['object-src'].includes("'none'"), 'object-src must be none.');
        assert(!csp.includes('unsafe-'), 'The policy must not contain unsafe-inline or unsafe-eval.');
      });

      test('index.html: exactly one module script and no inline code', async () => {
        const doc = parseHtml(await fetchText('index.html'));
        const scripts = Array.from(doc.querySelectorAll('script'));
        eq(scripts.length, 1, 'script tags');
        eq(scripts[0].getAttribute('type'), 'module');
        eq(scripts[0].getAttribute('src'), 'js/core/app.js');
        eq(scripts[0].textContent.trim(), '', 'inline script text');
        eq(doc.querySelectorAll('style').length, 0, 'style tags');
        eq(doc.querySelectorAll('[style]').length, 0, 'style attributes');
        const bad = [];
        for (const element of doc.querySelectorAll('*')) {
          for (const attribute of Array.from(element.attributes)) {
            if (/^on/i.test(attribute.name) || /^\s*javascript:/i.test(attribute.value)) { bad.push(element.tagName + '[' + attribute.name + ']'); }
          }
        }
        assert(bad.length === 0, 'Inline handlers found: ' + bad.join(', '));
      });

      test('index.html: basics (language, theme, viewport, manifest, stylesheets)', async () => {
        const doc = parseHtml(await fetchText('index.html'));
        eq(doc.documentElement.getAttribute('lang'), 'en');
        eq(doc.documentElement.getAttribute('data-theme'), 'auto');
        assert((doc.querySelector('meta[name="viewport"]').getAttribute('content') || '').includes('viewport-fit=cover'), 'viewport-fit=cover is missing.');
        eq(doc.querySelector('link[rel="manifest"]').getAttribute('href'), 'manifest.webmanifest');
        deepEq(Array.from(doc.querySelectorAll('link[rel="stylesheet"]')).map((link) => link.getAttribute('href')), CSS_FILES);
      });

      test('index.html contains every element the app looks up', async () => {
        const doc = parseHtml(await fetchText('index.html'));
        const appText = await fetchText('js/core/app.js');
        const wanted = new Set(INDEX_IDS);
        for (const match of appText.matchAll(/requireElement\('([^']+)'\)/g)) { wanted.add(match[1]); }
        for (const match of appText.matchAll(/getElementById\('([^']+)'\)/g)) { wanted.add(match[1]); }
        const missing = Array.from(wanted).filter((id) => !doc.getElementById(id));
        assert(missing.length === 0, 'Missing from index.html: ' + missing.join(', '));
      });

      test('every CSS class used by index.html, app.js and router.js is styled', async () => {
        const css = (await Promise.all(CSS_FILES.map(fetchText))).join('\n');
        const used = new Set();
        for (const path of ['index.html', 'js/core/app.js', 'js/core/router.js']) {
          for (const token of classTokens(await fetchText(path))) { used.add(token); }
        }
        const unstyled = Array.from(used).filter((token) => {
          if (UNSTYLED_OK.has(token)) { return false; }
          return !new RegExp('\\.' + token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z0-9_-])').test(css);
        });
        assert(unstyled.length === 0, 'Classes without CSS: ' + unstyled.join(', '));
      });

      test('every CSS variable that is used is defined', async () => {
        const texts = await Promise.all(CSS_FILES.map(fetchText));
        const all = texts.join('\n');
        const defined = new Set(Array.from(all.matchAll(/(--[a-z0-9-]+)(?=\s*:)/g)).map((match) => match[1]));
        const used = new Set(Array.from(all.matchAll(/var\(\s*(--[a-z0-9-]+)/g)).map((match) => match[1]));
        const missing = Array.from(used).filter((name) => !defined.has(name));
        assert(missing.length === 0, 'Undefined CSS variables: ' + missing.join(', '));
      });

      test('both dark theme blocks in tokens.css are identical', async () => {
        const tokens = await fetchText('css/tokens.css');
        const auto = declarations(blockAfter(tokens, ':root:not([data-theme="light"])'));
        const forced = declarations(blockAfter(tokens, ':root[data-theme="dark"]'));
        assert(Object.keys(auto).length > 20, 'The automatic dark block looks empty.');
        deepEq(auto, forced, 'dark blocks');
        const badCount = Object.keys(auto).filter((name) => (tokens.match(new RegExp(name + '\\s*:', 'g')) || []).length !== 3);
        assert(badCount.length === 0, 'Each dark variable must be declared once in light and twice in dark: ' + badCount.join(', '));
      });

      test('theme colours agree across tokens.css, index.html, app.js, manifest and icon', async () => {
        const tokens = await fetchText('css/tokens.css');
        const headerBgs = Array.from(tokens.matchAll(/--header-bg:\s*(#[0-9a-fA-F]{6})/g)).map((match) => match[1].toLowerCase());
        const light = headerBgs[0];
        const dark = headerBgs[1];
        eq(light, '#0b6e5a', 'light header colour');
        eq(dark, '#0e1513', 'dark header colour');
        const doc = parseHtml(await fetchText('index.html'));
        for (const meta of doc.querySelectorAll('meta[name="theme-color"]')) {
          const isDark = (meta.getAttribute('media') || '').includes('dark');
          eq(meta.getAttribute('content').toLowerCase(), isDark ? dark : light, 'theme-color meta');
        }
        const appText = (await fetchText('js/core/app.js')).toLowerCase();
        assert(appText.includes(light) && appText.includes(dark), 'app.js THEME_COLORS do not match.');
        const manifest = await fetchJson('manifest.webmanifest');
        eq(manifest.theme_color.toLowerCase(), light, 'manifest theme_color');
        eq(manifest.background_color.toLowerCase(), light, 'manifest background_color');
        const icon = (await fetchText('icons/icon.svg')).toLowerCase();
        assert(icon.includes(light) && icon.includes('#f2a900') && icon.includes('#1a1400'), 'icon.svg colours differ from the app.');
      });

      test('manifest is complete and its icons exist', async () => {
        const manifest = await fetchJson('manifest.webmanifest');
        eq(manifest.short_name, 'NASUR');
        eq(manifest.display, 'standalone');
        assert(manifest.start_url && manifest.scope && manifest.id, 'start_url, scope and id are required.');
        assert(Array.isArray(manifest.icons) && manifest.icons.length >= 1, 'The manifest needs at least one icon.');
        for (const icon of manifest.icons) { await fetchText(icon.src); }
      });

      test('the service worker pre-cache list covers every app file', async () => {
        const text = await fetchText('sw.js');
        const match = text.match(/const CORE_FILES = \[([\s\S]*?)\];/);
        assert(match, 'CORE_FILES was not found in sw.js.');
        const listed = Array.from(match[1].matchAll(/'([^']+)'/g)).map((item) => item[1]);
        const expected = PROJECT_FILES.filter((path) => path !== 'sw.js' && path !== 'data/modules.json');
        const missing = expected.filter((path) => !listed.includes(path));
        assert(missing.length === 0, 'Not pre-cached by sw.js: ' + missing.join(', '));
        const unknown = listed.filter((path) => !PROJECT_FILES.includes(path));
        assert(unknown.length === 0, 'sw.js lists files that are not in the project: ' + unknown.join(', '));
      });
    });


    /* ======================================================================
       4. SUITES THAT NEED THE APP MODULES
       ====================================================================== */

    async function resetDb() {
      await db.wipeDatabase();
      repo.resetRepoState();
      ucfg.resetConfigCache();
    }

    function recordEvents() {
      const events = [];
      const stop = ev.on('*', (payload, name) => { events.push({ name, payload }); });
      return { events, stop };
    }

    function defineAppSuites() {
      const S = cfg.STORES;
      const P = cfg.DEFAULTS.PROJECT_ID;

      /* ---------------- router.js: live view switching ---------------- */
      suite('Router (live view switching)', ({ test, before, after }) => {
        const original = { href: location.href, title: document.title, lastRoute: localStorage.getItem(cfg.LS_KEYS.LAST_ROUTE) };
        const log = [];
        let container;
        let focusTarget;
        let alphaSignal = null;

        const makeModule = (id, extra) => Object.assign({
          id, route: '/' + id.replace(/_/g, '-'), title: id.toUpperCase(), icon: '•', description: 'Test module ' + id,
          group: 'core', pdca: null, phase: 1, status: 'active', builtin: true, file: null, nav: null
        }, extra || {});
        const testRegistry = {
          schema_version: 1,
          pdca_stages: [{ id: 'plan', title: 'Plan', order: 1 }],
          groups: [{ id: 'core', title: 'Core', order: 1 }],
          modules: [
            makeModule('home'),
            makeModule('alpha', { nav: { order: 1, label: 'Alpha' } }),
            makeModule('beta_two'),
            makeModule('gamma', { status: 'planned', phase: 5, builtin: false }),
            makeModule('delta'),
            makeModule('epsilon', { builtin: false, file: 'js/modules/does-not-exist.js' })
          ]
        };

        function waitForRoute(predicate) {
          return new Promise((resolve, reject) => {
            const timer = setTimeout(() => { stop(); reject(new Error('The router did not show the expected page within 3 seconds.')); }, 3000);
            const stop = ev.on(cfg.EVENTS.ROUTE_CHANGED, (info) => {
              if (predicate(info)) { clearTimeout(timer); stop(); resolve(info); }
            });
          });
        }
        async function go(path, predicate) {
          const waiting = waitForRoute(predicate);
          router.navigate(path);
          return waiting;
        }

        before(() => {
          router.setModuleRegistry(testRegistry);
          container = document.createElement('div');
          container.hidden = true;
          focusTarget = document.createElement('div');
          focusTarget.tabIndex = -1;
          document.body.append(container, focusTarget);
          router.registerBuiltin('home', async (ctx) => { ctx.root.textContent = 'HOME VIEW'; });
          router.registerBuiltin('alpha', async (ctx) => {
            alphaSignal = ctx.signal;
            ctx.root.textContent = 'ALPHA ' + ctx.segments.join('|') + ' ' + (ctx.query.get('x') || '-');
            ctx.setTitle('Alpha title');
            return () => { log.push('alpha-cleanup'); };
          });
          router.registerBuiltin('beta_two', async (ctx) => {
            await sleep(80);
            if (ctx.signal.aborted) { return; }
            ctx.root.textContent = 'BETA VIEW';
          });
          router.registerBuiltin('delta', async () => { throw new Error('delta failed on purpose'); });
        });

        after(() => {
          if (router.isRouterRunning()) { router.stopRouter(); }
          router.clearModuleRegistry();
          if (container) { container.remove(); }
          if (focusTarget) { focusTarget.remove(); }
          history.replaceState(null, '', original.href);
          document.title = original.title;
          try {
            if (original.lastRoute === null) { localStorage.removeItem(cfg.LS_KEYS.LAST_ROUTE); } else { localStorage.setItem(cfg.LS_KEYS.LAST_ROUTE, original.lastRoute); }
          } catch { /* storage blocked */ }
        });

        test('starts and shows the view for the current address', async () => {
          history.replaceState(null, '', location.pathname + location.search + '#/alpha');
          await router.startRouter({ root: container, focusTarget });
          eq(router.isRouterRunning(), true);
          assert(container.textContent.includes('ALPHA'), 'The alpha view was not shown.');
          const info = router.getCurrentRoute();
          eq(info.module_id, 'alpha');
          eq(info.state, 'ok');
          deepEq(info.segments, []);
          assert(document.title.includes('Alpha title'), 'The view title was not applied.');
          eq(router.getCurrentView(), container.firstElementChild);
          await expectError(() => router.startRouter({ root: container }), Error);
        });
        test('passes segments and query to the view, aborts and cleans up the old view', async () => {
          const firstSignal = alphaSignal;
          log.length = 0;
          const info = await go('/alpha/seg1/seg%202?x=5', (item) => item.path.startsWith('/alpha/seg1'));
          eq(info.state, 'ok');
          deepEq(info.segments, ['seg1', 'seg 2']);
          eq(info.previous_path, '/alpha');
          eq(container.textContent, 'ALPHA seg1|seg 2 5');
          assert(log.includes('alpha-cleanup'), 'The previous view was not cleaned up.');
          eq(firstSignal.aborted, true, 'previous view signal');
          eq(alphaSignal.aborted, false, 'current view signal');
        });
        test('unknown pages show "Page not found"', async () => {
          const info = await go('/zzz', (item) => item.state === 'not_found');
          assert(container.textContent.includes('Page not found'), 'The not-found page was not shown.');
          assert(document.title.includes('Page not found'), 'The title was not updated.');
          eq(info.module_id, null);
        });
        test('planned modules show a friendly page', async () => {
          const info = await go('/gamma', (item) => item.module_id === 'gamma');
          eq(info.state, 'planned');
          assert(container.textContent.includes('build phase 5'), 'The planned page must mention the build phase.');
        });
        test('a view that throws shows an error page', async () => {
          const cap = captureConsole();
          try {
            const info = await go('/delta', (item) => item.module_id === 'delta');
            eq(info.state, 'error');
            assert(container.textContent.includes('could not be shown'), 'The error page was not shown.');
          } finally { cap.restore(); }
        });
        test('a module file that cannot be loaded shows an error page with a working retry button', async () => {
          const cap = captureConsole();
          try {
            const info = await go('/epsilon', (item) => item.module_id === 'epsilon');
            eq(info.state, 'error');
            assert(container.textContent.includes('could not be loaded'), 'The load-error page was not shown.');
            const button = container.querySelector('[data-router-action="retry"]');
            assert(button, 'The retry button is missing.');

        test('the navigation guard can block leaving a page', async () => {

        test('fast navigation never shows a stale view', async () => {

        test('an empty address opens Home', async () => {

        });
        test('the offline cache holds the essential files', async () => {
          if (typeof caches === 'undefined') { skip('Cache storage is not available in this browser.'); }
          const names = (await caches.keys()).filter((name) => name.startsWith('nasur-')).sort();
          if (names.length === 0) { skip('No NASUR cache yet. Open the app once on this address first.'); }
          const cache = await caches.open(names[names.length - 1]);
          const missing = [];
          for (const path of ['index.html', 'js/core/app.js', 'data/modules.json']) {
            if (!(await cache.match(new URL(path, ROOT).href))) { missing.push(path); }
          }
          assert(missing.length === 0, 'Not in the offline cache: ' + missing.join(', '));
        });
      });
    }

    if (loadFailures.length === 0) { defineAppSuites(); }


    /* ======================================================================
       5. RUNNER AND PAGE
       ====================================================================== */

    const counts = { pass: 0, fail: 0, skip: 0, total: 0, done: 0 };
    const report = [];

    function buildSuiteUi(entry) {
      const section = document.createElement('section');
      section.className = 'suite';
      const heading = document.createElement('h2');
      const title = document.createElement('span');
      title.textContent = entry.name;
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = '0 / ' + entry.tests.length;
      heading.append(title, count);
      const list = document.createElement('ul');
      section.append(heading, list);
      els.results.append(section);
      entry.ui = { count, list, done: 0 };
    }

    function addRow(entry, test, result) {
      const item = document.createElement('li');
      item.className = result.status;
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = result.status === 'pass' ? '✓' : result.status === 'fail' ? '✗' : '–';
      const body = document.createElement('div');
      const name = document.createElement('div');
      name.textContent = test.title;
      body.append(name);
      if (result.message) {
        const detail = document.createElement('pre');
        detail.textContent = result.message;
        body.append(detail);
      }
      item.append(mark, body);
      entry.ui.list.append(item);
      entry.ui.done += 1;
      entry.ui.count.textContent = entry.ui.done + ' / ' + entry.tests.length;
      counts[result.status] += 1;
      counts.done += 1;
      report.push(result.status.toUpperCase() + ' · ' + entry.name + ' › ' + test.title + (result.message ? ' — ' + result.message.replace(/\s+/g, ' ') : ''));
      els.summary.textContent = 'Running… ' + counts.done + ' of ' + counts.total;
    }

    async function runTest(test) {
      try {
        await withTimeout(test.fn(), TEST_TIMEOUT_MS);
        return { status: 'pass', message: '' };
      } catch (error) {
        if (error instanceof SkipSignal) { return { status: 'skip', message: error.message }; }
        return { status: 'fail', message: describeError(error) };
      }
    }

    async function removeStaleDatabases() {
      try {
        if (typeof indexedDB.databases !== 'function') { return; }
        for (const info of await indexedDB.databases()) {
          if (info.name && info.name.startsWith('nasur-test-') && info.name !== TEST_DB) { indexedDB.deleteDatabase(info.name); }
        }
      } catch { /* listing databases is not supported everywhere */ }
    }

    async function cleanup() {
      try {
        if (db) { await db.wipeDatabase(); db.closeDb(); }
      } catch { /* the scratch database will be removed by the next run */ }
      for (const key of LS_WATCH) {
        try {
          if (lsBackup[key] === null) { localStorage.removeItem(key); } else { localStorage.setItem(key, lsBackup[key]); }
        } catch { /* storage blocked */ }
      }
    }

    function finish(started) {
      const seconds = ((performance.now() - started) / 1000).toFixed(1);
      const bad = counts.fail > 0;
      els.summary.className = bad ? 'bad' : 'ok';
      els.summary.textContent = bad
        ? counts.fail + ' of ' + counts.total + ' checks FAILED (' + counts.pass + ' passed, ' + counts.skip + ' skipped) in ' + seconds + ' s'
        : 'All ' + (counts.total - counts.skip) + ' checks passed' + (counts.skip > 0 ? ' (' + counts.skip + ' skipped)' : '') + ' in ' + seconds + ' s';
      document.title = (bad ? '✗ ' : '✓ ') + 'NASUR Phase 1 tests';
    }

    function reportText() {
      return [
        'NASUR Phase 1 test report',
        els.summary.textContent,
        'Page: ' + location.origin + location.pathname,
        'Browser: ' + navigator.userAgent,
        'Scratch database: ' + TEST_DB,
        ''
      ].concat(loadFailures.map((failure) => 'LOAD FAILURE · ' + failure.path + ' — ' + failure.message), report).join('\n');
    }

    async function copyReport() {
      const text = reportText();
      try {
        await navigator.clipboard.writeText(text);
        els.copy.textContent = 'Copied ✓';
      } catch {
        els.fallback.style.display = 'block';
        els.fallback.value = text;
        els.fallback.focus();
        els.fallback.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch { copied = false; }
        els.copy.textContent = copied ? 'Copied ✓' : 'Select the text below and copy it';
      }
      setTimeout(() => { els.copy.textContent = 'Copy report'; }, 2500);
    }

    async function main() {
      const started = performance.now();
      counts.total = suites.reduce((sum, entry) => sum + entry.tests.length, 0);
      if (loadFailures.length > 0) {
        els.summary.className = 'bad';
        els.summary.textContent = loadFailures.length + ' app file(s) failed to load, so most checks were not run. See "Modules load without errors" below.';
      }
      await removeStaleDatabases();
      if (db) { db.setDatabaseName(TEST_DB); }

      for (const entry of suites) {
        buildSuiteUi(entry);
        let setupError = null;
        if (entry.before) {
          try { await withTimeout(entry.before(), TEST_TIMEOUT_MS); } catch (error) { setupError = error; }
        }
        for (const test of entry.tests) {
          const result = setupError ? { status: 'fail', message: 'Setup failed: ' + describeError(setupError) } : await runTest(test);
          addRow(entry, test, result);
        }
        if (entry.after) {
          try { await withTimeout(entry.after(), TEST_TIMEOUT_MS); } catch (error) { console.warn('Suite cleanup failed:', error); }
        }
      }
      await cleanup();
      if (loadFailures.length === 0) { finish(started); }
    }

    els.copy.addEventListener('click', () => { void copyReport(); });
    els.rerun.addEventListener('click', () => { history.replaceState(null, '', location.pathname + location.search); location.reload(); });
    els.onlyFailed.addEventListener('change', () => { els.results.classList.toggle('only-failed', els.onlyFailed.checked); });

    main().catch(async (error) => {
      console.error('The test runner itself failed.', error);
      els.summary.className = 'bad';
      els.summary.textContent = 'The test runner stopped unexpectedly: ' + describeError(error);
      await cleanup();
    });
  </script>
</body>
</html>
