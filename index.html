<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b6e5a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
  <meta name="application-name" content="NASUR">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="NASUR is an offline-first personal industrial HSE operating system with the JARVIS safety assistant.">
  <title>NASUR – HSE Operating System</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#app-main">Skip to main content</a>

  <noscript>
    <p class="noscript-msg">NASUR needs JavaScript to run. Please enable JavaScript in your browser settings and reload this page.</p>
  </noscript>

  <div class="boot" id="boot-screen" role="status" aria-live="polite">
    <div class="boot__logo" aria-hidden="true">N</div>
    <p class="boot__title">NASUR</p>
    <p class="boot__text">Starting your safety workspace…</p>
    <div class="boot__spinner" aria-hidden="true"></div>
    <p class="boot__stuck" id="boot-stuck">Taking longer than expected. Check that every NASUR file was uploaded to the Space, then reload this page. If it keeps failing, open the browser console to see the exact error.</p>
  </div>

  <header class="app-header" id="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo" aria-hidden="true">N</span>
      <div class="app-header__text">
        <h1 class="app-header__title">NASUR</h1>
        <p class="app-header__subtitle" id="app-subtitle">HSE Operating System</p>
      </div>
    </div>
    <div class="app-header__actions">
      <span class="status-pill" id="status-network" data-state="unknown" role="status">Checking…</span>
      <button type="button" class="icon-btn" id="btn-theme" aria-label="Change colour theme">
        <span class="icon-btn__glyph" id="btn-theme-glyph" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <nav class="main-nav" id="main-nav" aria-label="Primary navigation">
    <ul class="main-nav__list" id="main-nav-list"></ul>
  </nav>

  <main class="app-main" id="app-main" tabindex="-1">
    <div class="view-root" id="view-root" aria-live="polite"></div>
  </main>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>
  <div class="jarvis-root" id="jarvis-root"></div>

  <script type="module" src="js/core/app.js"></script>
</body>
</html>
